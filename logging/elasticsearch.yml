# =============================================================================
# University MIS - Elasticsearch Configuration
# 3-node cluster for log storage (deployed via the Elastic Cloud on
# Kubernetes (ECK) operator or the elastic/elasticsearch Helm chart).
# This file documents the core settings passed to each node.
# =============================================================================

cluster.name: university-mis-logs
node.name: ${HOSTNAME}

# Discovery - list of master-eligible node service names (StatefulSet DNS)
discovery.seed_hosts:
  - elasticsearch-0.elasticsearch-headless.monitoring.svc.cluster.local
  - elasticsearch-1.elasticsearch-headless.monitoring.svc.cluster.local
  - elasticsearch-2.elasticsearch-headless.monitoring.svc.cluster.local

cluster.initial_master_nodes:
  - elasticsearch-0
  - elasticsearch-1
  - elasticsearch-2

node.roles: ["master", "data", "ingest"]

path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# Security - TLS + authentication enabled (never run with security disabled
# in production)
xpack.security.enabled: true
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: certificate
xpack.security.transport.ssl.keystore.path: certs/elastic-certificates.p12
xpack.security.transport.ssl.truststore.path: certs/elastic-certificates.p12
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.keystore.path: certs/http.p12

# Index lifecycle management - rotate/delete old log indices automatically
xpack.ilm.enabled: true

# Memory - heap size set via ES_JAVA_OPTS env var (should be ~50% of pod
# memory limit, max 32GB), not in this file.
bootstrap.memory_lock: true

# Networking
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300
