# =============================================================================
# University MIS - Security Pipeline
# Static analysis, dependency audit, secret scanning, and container scanning.
# Runs on every PR, on a nightly schedule, and on demand.
# =============================================================================
name: Security

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------
  # Dependency vulnerability audit (npm audit) for both services
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Static Application Security Testing (SonarQube / SAST)
  # ---------------------------------------------------------------------
  sast-scan:
    name: SAST (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---------------------------------------------------------------------
  # Secret scanning - catch committed credentials before merge
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------
  # Dynamic Application Security Testing (OWASP ZAP baseline scan)
  # Runs against a deployed staging URL; skip if not configured.
  # ---------------------------------------------------------------------
  dast-scan:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: false

  # ---------------------------------------------------------------------
  # Container image scanning (build locally, scan with Trivy)
  # ---------------------------------------------------------------------
  container-scan:
    name: Container Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image locally (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: false
          load: true
          tags: university-mis/${{ matrix.service }}:security-scan

      - name: Run Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: university-mis/${{ matrix.service }}:security-scan
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

  # ---------------------------------------------------------------------
  # Kubernetes manifest security linting (checks for missing security
  # contexts, privileged containers, unbounded resources, etc.)
  # ---------------------------------------------------------------------
  k8s-manifest-scan:
    name: Kubernetes Manifest Scan (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: kubernetes

  # ---------------------------------------------------------------------
  # Terraform static analysis (checkov / tfsec) for IaC misconfigurations
  # ---------------------------------------------------------------------
  terraform-scan:
    name: Terraform Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
