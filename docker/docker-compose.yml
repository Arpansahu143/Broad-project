# =============================================================================
# University MIS - Docker Compose (Local Development)
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml down -v
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------
  # Frontend - React served via Nginx
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:5000/api
        REACT_APP_ENV: development
    image: university-mis/frontend:dev
    container_name: mis-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mis-frontend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------
  # Backend - Node.js + Express API
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: university-mis/backend:dev
    container_name: mis-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mis-frontend-net
      - mis-backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------
  # PostgreSQL - Primary relational database
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-university_mis}
      POSTGRES_USER: ${DB_USER:-mis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - mis-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mis_admin} -d ${DB_NAME:-university_mis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------
  # Redis - Cache & session store
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mis-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mis-backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mis-frontend-net:
    driver: bridge
  mis-backend-net:
    driver: bridge
    internal: false  # set true in fully isolated environments

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
