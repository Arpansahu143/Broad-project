server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — any path that isn't a real file falls back to
    # index.html so client-side routing works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the backend container using Docker Compose's internal
    # service DNS name. This is what makes the default
    # VITE_API_URL=/api/v1 (a relative path) actually work — the
    # browser only ever talks to this nginx origin, which forwards
    # API calls internally.
    location /api/v1/ {
        proxy_pass http://backend:5000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
