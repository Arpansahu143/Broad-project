# =============================================================================
# University MIS - Prometheus Configuration
# Scrapes application metrics, Kubernetes cluster/pod metrics, node metrics,
# and PostgreSQL/Redis exporter metrics. Alert rules live in alert.rules.yml
# and are evaluated here, then routed through Alertmanager.
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: university-mis-cluster
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert.rules.yml"

scrape_configs:

  # ---------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------
  # Node Exporter - host-level CPU / memory / disk / network metrics
  # ---------------------------------------------------------------------
  - job_name: "node-exporter"
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: ["monitoring"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: node-exporter
        action: keep

  # ---------------------------------------------------------------------
  # Kubernetes API server
  # ---------------------------------------------------------------------
  - job_name: "kubernetes-apiservers"
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # ---------------------------------------------------------------------
  # cAdvisor (per-pod container CPU/memory) via kubelet
  # ---------------------------------------------------------------------
  - job_name: "kubernetes-cadvisor"
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # ---------------------------------------------------------------------
  # Pod auto-discovery: scrape any pod annotated prometheus.io/scrape=true
  # (this is how frontend-deployment.yaml and backend-deployment.yaml
  # expose their /metrics endpoints)
  # ---------------------------------------------------------------------
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["university-mis"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # ---------------------------------------------------------------------
  # PostgreSQL exporter (postgres_exporter sidecar / deployment)
  # ---------------------------------------------------------------------
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter.university-mis.svc.cluster.local:9187"]
        labels:
          component: database

  # ---------------------------------------------------------------------
  # Redis exporter
  # ---------------------------------------------------------------------
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter.university-mis.svc.cluster.local:9121"]
        labels:
          component: cache
