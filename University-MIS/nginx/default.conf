# =============================================================================
# University MIS - Nginx Server Block
# Serves the React SPA and reverse-proxies /api requests to the backend.
# TLS termination happens at the Kubernetes Ingress / ALB in production;
# this container listens on plain HTTP internally (port 8080).
# =============================================================================

# Upstream backend pool (Kubernetes Service DNS name in-cluster, or the
# docker-compose service name in local development)
upstream backend_api {
    server backend-service:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # Health check endpoint for Kubernetes probes / Docker healthcheck
    # ---------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # ---------------------------------------------------------------
    # Reverse proxy: /api/* -> backend service
    # ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Do not cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------
    # Static assets - long-lived caching (filenames are content-hashed
    # by the React build, so aggressive caching is safe)
    # ---------------------------------------------------------------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # SPA fallback - all other routes serve index.html so client-side
    # routing (React Router) can take over
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Never let the browser cache index.html so deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Deny access to dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
