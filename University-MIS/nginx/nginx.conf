# =============================================================================
# University MIS - Nginx Main Configuration
# Global settings: worker tuning, gzip compression, logging, and security
# defaults. Server/route-specific config lives in default.conf.
# =============================================================================

# Running as non-root inside the container (see Dockerfile.frontend), so no
# `user` directive override is needed here.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
    use                epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'rt=$request_time uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ------------------------------------------------------------------
    # Performance
    # ------------------------------------------------------------------
    sendfile            on;
    tcp_nopush           on;
    tcp_nodelay           on;
    keepalive_timeout    65;
    types_hash_max_size  2048;
    client_max_body_size 10m;

    # Hide the Nginx version string from response headers
    server_tokens off;

    # ------------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------------
    gzip             on;
    gzip_vary          on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers (defense in depth; also set at the Ingress/ALB layer)
    # ------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.mis.university.edu; frame-ancestors 'none';" always;

    # ------------------------------------------------------------------
    # Rate limiting zone (applied per-location in default.conf)
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ------------------------------------------------------------------
    # Caching for static assets (map file extension to cache duration)
    # ------------------------------------------------------------------
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }
    expires $expires;

    include /etc/nginx/conf.d/*.conf;
}
