# =============================================================================
# University MIS - Services
# ClusterIP services exposing each component internally within the cluster.
# External access is handled by ingress.yaml.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: university-mis
  labels:
    app: university-mis
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: university-mis
    component: frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: university-mis
  labels:
    app: university-mis
    component: backend
spec:
  type: ClusterIP
  selector:
    app: university-mis
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: university-mis
  labels:
    app: university-mis
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: university-mis
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: university-mis
  labels:
    app: university-mis
    component: redis
spec:
  type: ClusterIP
  selector:
    app: university-mis
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
