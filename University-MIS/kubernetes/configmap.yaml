# =============================================================================
# University MIS - ConfigMap
# Non-sensitive configuration shared across frontend and backend pods.
# NEVER put credentials or secrets here — use secret.yaml instead.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: university-mis-config
  namespace: university-mis
  labels:
    app: university-mis
data:
  NODE_ENV: "production"
  PORT: "5000"

  # Database connection (non-sensitive parts)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "university_mis"
  DB_SSL: "true"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"

  # Redis connection (non-sensitive parts)
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_TTL_SECONDS: "3600"

  # AWS / S3 (non-sensitive parts — credentials come from IRSA or secrets)
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "university-mis-storage"

  # Application settings
  REACT_APP_API_BASE_URL: "https://api.mis.university.edu"
  CORS_ALLOWED_ORIGINS: "https://mis.university.edu"
  LOG_LEVEL: "info"
  JWT_EXPIRY: "1h"
  JWT_REFRESH_EXPIRY: "7d"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
