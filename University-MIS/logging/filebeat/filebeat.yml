# =============================================================================
# University MIS - Filebeat Configuration
# Ships container logs from all pods in the university-mis namespace to
# Logstash for parsing/enrichment before indexing into Elasticsearch.
# Deployed as a DaemonSet so one Filebeat instance runs per node.
# =============================================================================

filebeat.autodiscover:
  providers:
    - type: kubernetes
      node: ${NODE_NAME}
      hints.enabled: true
      templates:
        - condition:
            contains:
              kubernetes.namespace: university-mis
          config:
            - type: container
              paths:
                - "/var/log/containers/*${data.kubernetes.container.id}.log"
              multiline:
                pattern: '^\d{4}-\d{2}-\d{2}'
                negate: true
                match: after
                max_lines: 500
                timeout: 5s

processors:
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      matchers:
        - logs_path:
            logs_path: "/var/log/containers/"
  - add_cloud_metadata: {}
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs.version"]
      ignore_missing: true

output.logstash:
  hosts: ["logstash.monitoring.svc.cluster.local:5044"]
  loadbalance: true
  bulk_max_size: 2048
  compression_level: 3
  ssl.enabled: true
  ssl.certificate_authorities: ["/etc/filebeat/certs/ca.crt"]

logging.level: info
logging.to_stderr: true

# Backpressure-friendly queue settings
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s
