# =============================================================================
# University MIS - Logstash Pipeline
# Receives logs from Filebeat, parses JSON application logs, enriches with
# Kubernetes metadata (already attached by Filebeat), and indexes into
# Elasticsearch with a daily index rotation.
# =============================================================================

input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key => "/etc/logstash/certs/logstash.key"
    ssl_client_authentication => "required"
  }
}

filter {
  # Parse structured JSON logs emitted by the Node.js backend
  if [kubernetes][labels][component] == "backend" {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }

    if [app][level] {
      mutate {
        add_field => { "log_level" => "%{[app][level]}" }
      }
    }
  }

  # Parse Nginx access logs from the frontend
  if [kubernetes][labels][component] == "frontend" {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{USER:remote_user} \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{DATA:request_path} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code} %{NUMBER:bytes_sent}'
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  }

  # Normalize severity across sources for unified Kibana filtering
  if [log_level] {
    mutate {
      uppercase => ["log_level"]
    }
  }

  # Drop noisy healthcheck log lines to reduce index volume
  if [request_path] == "/healthz" or [request_path] == "/health" {
    drop {}
  }

  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch.monitoring.svc.cluster.local:9200"]
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    user => "${ELASTIC_USERNAME}"
    password => "${ELASTIC_PASSWORD}"
    index => "university-mis-logs-%{[kubernetes][labels][component]}-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "university-mis-logs"
    ilm_policy => "university-mis-logs-policy"
  }

  # Optional: also print to stdout in dev/debug environments
  # stdout { codec => rubydebug }
}
