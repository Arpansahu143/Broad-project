# =============================================================================
# University MIS - Prometheus Alert Rules
# Referenced by prometheus.yml (rule_files). Covers CPU, memory, pod health,
# database, and cache alerting.
# =============================================================================

groups:
  - name: node-resource-alerts
    rules:
      - alert: HighNodeCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 85% for 10 minutes on {{ $labels.instance }}."

      - alert: HighNodeMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 85% for 10 minutes on {{ $labels.instance }}."

      - alert: NodeDiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space is below 15% on {{ $labels.instance }} ({{ $labels.mountpoint }})."

  - name: pod-alerts
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="university-mis"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in 15 minutes."

      - alert: PodNotReady
        expr: kube_pod_status_ready{namespace="university-mis", condition="true"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} has been in a not-ready state for more than 10 minutes."

      - alert: HighPodMemoryUsage
        expr: (container_memory_working_set_bytes{namespace="university-mis"} / container_spec_memory_limit_bytes{namespace="university-mis"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} near memory limit"
          description: "Pod {{ $labels.pod }} is using more than 90% of its memory limit."

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas{namespace="university-mis"} != kube_deployment_status_replicas_available{namespace="university-mis"}
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} replica mismatch"
          description: "Deployment {{ $labels.deployment }} does not have the desired number of available replicas."

  - name: application-alerts
    rules:
      - alert: HighHTTPErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "More than 5% of requests to {{ $labels.service }} are failing with 5xx errors."

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "95th percentile latency for {{ $labels.service }} has exceeded 1 second."

  - name: database-alerts
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance is down"
          description: "The postgres_exporter has not been able to reach PostgreSQL for 2 minutes."

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) by (instance) > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count high on {{ $labels.instance }}"
          description: "PostgreSQL has more than 150 active connections."

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration[5m]) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected on PostgreSQL"
          description: "Some PostgreSQL transactions are running longer than 60 seconds."

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis instance is down"
          description: "The redis_exporter has not been able to reach Redis for 2 minutes."

      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using more than 90% of its configured max memory."
