# =============================================================================
# University MIS - Test Pipeline
# Focused, fast-feedback test workflow for pull requests: unit, integration,
# and end-to-end tests, run in parallel where possible.
# =============================================================================
name: Test

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------
  # Unit tests (frontend + backend), run in parallel via matrix
  # ---------------------------------------------------------------------
  unit:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage --watchAll=false --ci

      - name: Enforce coverage threshold
        working-directory: ${{ matrix.service }}
        run: npx nyc check-coverage --lines 70 --functions 70 --branches 60 --if-present

  # ---------------------------------------------------------------------
  # Integration tests: backend API against real Postgres + Redis
  # ---------------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: university_mis_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations & seed test data
        working-directory: backend
        run: |
          npm run migrate --if-present
          npm run seed:test --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: university_mis_test
          DB_USER: test_user
          DB_PASSWORD: test_password

      - name: Run integration test suite
        working-directory: backend
        run: npm run test:integration --if-present
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: university_mis_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-only-secret-not-for-production

  # ---------------------------------------------------------------------
  # End-to-end tests using Docker Compose to spin up the full stack
  # ---------------------------------------------------------------------
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cat <<EOF > .env
          DB_NAME=university_mis_test
          DB_USER=test_user
          DB_PASSWORD=test_password
          REDIS_PASSWORD=test_redis_password
          JWT_SECRET=test-only-secret-not-for-production
          EOF

      - name: Start full stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Wait for services to become healthy
        run: |
          timeout 120s bash -c \
            'until [ "$(docker inspect -f {{.State.Health.Status}} mis-backend)" == "healthy" ]; do sleep 3; done'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright / Cypress and run E2E suite
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps --if-present
          npm run test:e2e --if-present
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
