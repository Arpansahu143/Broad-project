# =============================================================================
# University MIS - PostgreSQL StatefulSet
# Uses a StatefulSet (not a plain Deployment) so storage identity is stable
# across restarts/rescheduling, which is critical for a database.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: university-mis
  labels:
    app: university-mis
    component: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: university-mis
      component: postgres
  template:
    metadata:
      labels:
        app: university-mis
        component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      nodeSelector:
        node-role: "data-tier"
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: university-mis-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(DB_USER)", "-d", "$(DB_NAME)"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(DB_USER)", "-d", "$(DB_NAME)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi
---
# Headless service required by the StatefulSet for stable network identity
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: university-mis
  labels:
    app: university-mis
    component: postgres
spec:
  clusterIP: None
  selector:
    app: university-mis
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
