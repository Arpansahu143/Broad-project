# =============================================================================
# University MIS - RBAC
# Dedicated, least-privilege ServiceAccounts for application pods and for
# the CI/CD deployer, instead of relying on the default ServiceAccount.
# =============================================================================

# ServiceAccount used by backend pods (annotate for IRSA to grant S3/RDS access
# without static AWS keys — see terraform/iam.tf for the matching IAM role).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: university-mis
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/university-mis-backend-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: university-mis
---
# CI/CD deployer role - scoped to only what `kubectl apply`/rollout needs
# within this namespace, nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-cd-deployer
  namespace: university-mis
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-cd-deployer-sa
  namespace: university-mis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-cd-deployer-binding
  namespace: university-mis
subjects:
  - kind: ServiceAccount
    name: ci-cd-deployer-sa
    namespace: university-mis
roleRef:
  kind: Role
  name: ci-cd-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Read-only role for developers/observers (kubectl get/describe/logs only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-viewer
  namespace: university-mis
rules:
  - apiGroups: ["", "apps", "autoscaling", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
