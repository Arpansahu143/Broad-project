# =============================================================================
# University MIS - Ingress
# Routes external traffic to frontend/backend, terminates TLS via
# cert-manager + Let's Encrypt, enforces HTTPS and basic rate limiting.
# Assumes an NGINX Ingress Controller is installed on the cluster.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: university-mis-ingress
  namespace: university-mis
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - mis.university.edu
        - api.mis.university.edu
      secretName: university-mis-tls
  rules:
    - host: mis.university.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: api.mis.university.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
