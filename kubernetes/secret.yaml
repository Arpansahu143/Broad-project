# =============================================================================
# University MIS - Secret Template
# =============================================================================
# ⚠️  DO NOT COMMIT REAL SECRET VALUES TO GIT — THIS FILE IS A TEMPLATE ONLY.
#
# Recommended approaches for production:
#   1. Sealed Secrets (bitnami-labs/sealed-secrets) — encrypt before committing
#   2. External Secrets Operator — sync from AWS Secrets Manager / SSM
#   3. SOPS + KMS — encrypt this file at rest, decrypt at apply-time
#   4. Or simply create imperatively and never commit it:
#        kubectl create secret generic university-mis-secrets \
#          --namespace university-mis \
#          --from-literal=DB_USER=mis_admin \
#          --from-literal=DB_PASSWORD='<strong-password>' \
#          --from-literal=REDIS_PASSWORD='<strong-password>' \
#          --from-literal=JWT_SECRET='<random-64-char-string>' \
#          --from-literal=JWT_REFRESH_SECRET='<random-64-char-string>' \
#          --from-literal=AWS_ACCESS_KEY_ID='<if-not-using-IRSA>' \
#          --from-literal=AWS_SECRET_ACCESS_KEY='<if-not-using-IRSA>'
#
#   Prefer IRSA (IAM Roles for Service Accounts) over static AWS keys —
#   see terraform/iam.tf for the associated IAM role.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: university-mis-secrets
  namespace: university-mis
  labels:
    app: university-mis
type: Opaque
stringData:
  DB_USER: "REPLACE_ME_DB_USER"
  DB_PASSWORD: "REPLACE_ME_DB_PASSWORD"
  DB_NAME: "university_mis"
  REDIS_PASSWORD: "REPLACE_ME_REDIS_PASSWORD"
  JWT_SECRET: "REPLACE_ME_JWT_SECRET_MIN_64_CHARS"
  JWT_REFRESH_SECRET: "REPLACE_ME_JWT_REFRESH_SECRET_MIN_64_CHARS"
  AWS_ACCESS_KEY_ID: "REPLACE_ME_IF_NOT_USING_IRSA"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME_IF_NOT_USING_IRSA"
  S3_BUCKET_NAME: "university-mis-storage"
